<html lang="en">
<head>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.18.1/vis.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.18.1/vis.min.css" rel="stylesheet" type="text/css"/>
    <link rel="shortcut icon" href="#"/>
</head>
<body>
<script type="text/javascript">
    function showhideclass(id) {
        var elements = document.getElementsByClassName(id)
        for (var i = 0; i < elements.length; i++) {
            elements[i].style.display = (elements[i].style.display != 'none') ? 'none' : 'block';
        }
    }
</script>
<style>
    @media print { .noPrint { display: none; } }
    html,
    body {
        height: 100%;
        margin: 0;
    }
    body {
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
    }
    #layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        transition: grid-template-columns 180ms ease;
    }
    #layout.sidebar-collapsed {
        grid-template-columns: minmax(0, 1fr) 0;
    }
    #mynetwork {
        min-width: 0;
        height: 100%;
    }
    #sidebar {
        position: relative;
        min-width: 0;
        box-sizing: border-box;
        border-left: 1px solid #ddd;
        overflow: visible;
        padding: 10px;
        transition: padding 180ms ease, border-color 180ms ease;
    }
    #layout.sidebar-collapsed #sidebar {
        border-left-color: transparent;
        padding-left: 0;
        padding-right: 0;
    }
    #sidebar-content {
        height: 100%;
        overflow: auto;
    }
    #layout.sidebar-collapsed #sidebar-content {
        display: none;
    }
    #sidebar-toggle {
        position: absolute;
        top: 10px;
        left: -38px;
        z-index: 2;
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 20px;
        line-height: 32px;
    }
    #details {
        margin-bottom: 10px;
        overflow-wrap: anywhere;
    }
    #controls {
        padding-top: 8px;
    }
    footer {
        flex: 0 0 auto;
        border-top: 1px solid #ddd;
        padding: 6px 10px;
    }
    footer p {
        margin: 0;
    }
    .button {
        background-color: #5555cc;
        border: none;
        color: white;
        padding: 5px 10px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 18px;
        cursor: pointer;
    }
</style>

<div id="layout" class="sidebar-collapsed">
    <div id="mynetwork"></div>
    <aside id="sidebar" class="noPrint">
        <button id="sidebar-toggle" onclick="javascript:toggleSidebar()" class="button" title="Show / hide sidebar" aria-expanded="false">&lt;</button>
        <div id="sidebar-content">
            <div id="details">Pipeline: {{PIPELINE_NAME}}</div>
            <button onclick="javascript:toggleControls()" class="button">
                Show / hide graph controls
            </button>
            <div id="controls" class="controls" style="display:none"></div>
        </div>
    </aside>
</div>

<script type="text/javascript">
    function redrawNetwork() {
        if (window.network) {
            window.network.redraw();
        }
    }

    function toggleControls() {
        showhideclass('controls');
        redrawNetwork();
    }

    function toggleSidebar() {
        var layout = document.getElementById('layout');
        var button = document.getElementById('sidebar-toggle');
        var collapsed = layout.classList.toggle('sidebar-collapsed');
        button.innerHTML = collapsed ? '&lt;' : '&gt;';
        button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        redrawNetwork();
        window.setTimeout(redrawNetwork, 220);
    }

    var nodes = new vis.DataSet({{NODES_JSON}});
    var edges = new vis.DataSet({{EDGES_JSON}});

    let container = document.getElementById('mynetwork');
    var controls = document.getElementById('controls');
    var options = {
        autoResize: true,
        locale: 'en',
        edges: { arrows: { to: { enabled: true } }, smooth: { enabled: false } },
        nodes: { font: { 'face': 'monospace', 'align': 'left' } },
        layout: {
            "hierarchical": {
                "enabled": true,
                "sortMethod": "directed",
                "direction": "LR",
                levelSeparation: 275,
                nodeSpacing: 70,
                treeSpacing: 15
            }
        },
        physics: { enabled: false },
        configure: { enabled: true, filter: 'layout physics', showButton: false, container: controls }
    };

    let network = new vis.Network(container, {nodes, edges}, options);
    window.network = network;
    network.setSize('100%', '100%');
    network.redraw();
    network.on('click', function (properties) {
        var ids = properties.nodes;
        var clickedNodes = nodes.get(ids);
        var control = document.getElementById("details");
        if (clickedNodes[0]) {
            control.innerHTML = clickedNodes[0].full_label || clickedNodes[0].label;
        } else {
            control.innerHTML = "<b>Pipeline</b>: {{PIPELINE_NAME}}";
        }
    });
</script>
<footer>
    <div class="container-fluid">
        <div class="info">
            <p>Pipeline dependencies graph</p>
        </div>
    </div>
</footer>
</body>
</html>
