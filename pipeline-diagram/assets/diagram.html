<html lang="en">
<head>
    <meta charset="utf-8"/>
    <!-- Modern vis-network (standalone UMD: bundles vis-data's DataSet and its own CSS). -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="shortcut icon" href="#"/>
</head>
<body>
<style>
    @media print { .noPrint { display: none; } }
    @media print { html, body { overflow: visible; } }
    html,
    body {
        height: 100%;
        margin: 0;
        /* Fill the viewport exactly: the graph pans/zooms internally and the
           sidebar scrolls internally, so the document itself never scrolls.
           Without this, sub-pixel canvas sizing yields spurious window scrollbars. */
        overflow: hidden;
    }
    body {
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
    }
    #layout {
        display: grid;
        /* Sidebar takes the controls' natural width (so no scrollbars when
           there's room), capped so it can't crowd out the graph. */
        grid-template-columns: minmax(0, 1fr) fit-content(680px);
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        transition: grid-template-columns 180ms ease;
    }
    #layout.sidebar-collapsed {
        grid-template-columns: minmax(0, 1fr) 0;
    }
    #graph {
        position: relative;
        min-width: 0;
        height: 100%;
    }
    #mynetwork {
        height: 100%;
    }
    #sidebar {
        position: relative;
        min-width: 0;
        box-sizing: border-box;
        border-left: 1px solid #ddd;
        overflow: visible;
        padding: 10px;
        transition: padding 180ms ease, border-color 180ms ease;
    }
    #layout.sidebar-collapsed #sidebar {
        border-left-color: transparent;
        padding-left: 0;
        padding-right: 0;
    }
    #sidebar-content {
        height: 100%;
        /* Scroll only when the controls genuinely don't fit the viewport. */
        overflow: auto;
    }
    #layout.sidebar-collapsed #sidebar-content {
        display: none;
    }
    #sidebar-toggle {
        position: absolute;
        top: 10px;
        left: -38px;
        z-index: 2;
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 20px;
        line-height: 32px;
    }
    #details {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1;
        max-width: calc(100% - 16px);
        box-sizing: border-box;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid #ddd;
        border-radius: 4px;
        overflow-wrap: anywhere;
    }
    #controls {
        padding-top: 8px;
    }
    /* vis-network's configuration wrapper is a fixed 700px, but its rows are
       only ~495px wide — leaving a generous empty gutter that makes the open
       sidebar far wider than the controls need. Hug the real content width. */
    #controls .vis-configuration-wrapper {
        width: 520px;
    }
    footer {
        flex: 0 0 auto;
        border-top: 1px solid #ddd;
        padding: 6px 10px;
    }
    footer p {
        margin: 0;
    }
    /* No generation stamp (e.g. compile-time diagrams) → no empty status bar. */
    footer:has(p:empty) {
        display: none;
    }
    .button {
        background-color: #5555cc;
        border: none;
        color: white;
        padding: 5px 10px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 18px;
        cursor: pointer;
    }
</style>

<div id="layout" class="sidebar-collapsed">
    <div id="graph">
        <div id="details">Pipeline: {{PIPELINE_NAME}}</div>
        <div id="mynetwork"></div>
    </div>
    <aside id="sidebar" class="noPrint">
        <button id="sidebar-toggle" onclick="javascript:toggleSidebar()" class="button" title="Show / hide sidebar" aria-expanded="false">&lt;</button>
        <div id="sidebar-content">
            <div id="controls"></div>
        </div>
    </aside>
</div>

<script type="text/javascript">
    function redrawNetwork() {
        if (window.network) {
            window.network.redraw();
        }
    }

    function toggleSidebar() {
        var layout = document.getElementById('layout');
        var button = document.getElementById('sidebar-toggle');
        var collapsed = layout.classList.toggle('sidebar-collapsed');
        button.innerHTML = collapsed ? '&lt;' : '&gt;';
        button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        redrawNetwork();
        window.setTimeout(redrawNetwork, 220);
    }

    var nodesArr = {{NODES_JSON}};
    var edgesArr = {{EDGES_JSON}};

    // Assign hierarchical levels by longest path from the sources, so every
    // input node sits strictly left of the stage that consumes it (more
    // reliable than leaving level assignment to the layout's "directed" sort).
    (function assignLevels() {
        var indeg = {}, adj = {}, level = {};
        nodesArr.forEach(function (n) { indeg[n.id] = 0; adj[n.id] = []; level[n.id] = 0; });
        edgesArr.forEach(function (e) {
            if (adj[e.from] !== undefined && indeg[e.to] !== undefined) {
                adj[e.from].push(e.to);
                indeg[e.to] += 1;
            }
        });
        var queue = nodesArr.filter(function (n) { return indeg[n.id] === 0; })
                            .map(function (n) { return n.id; });
        while (queue.length) {
            var u = queue.shift();
            adj[u].forEach(function (v) {
                if (level[v] < level[u] + 1) { level[v] = level[u] + 1; }
                indeg[v] -= 1;
                if (indeg[v] === 0) { queue.push(v); }
            });
        }
        nodesArr.forEach(function (n) { n.level = level[n.id]; });
    })();

    var nodes = new vis.DataSet(nodesArr);
    var edges = new vis.DataSet(edgesArr);

    let container = document.getElementById('mynetwork');
    var controls = document.getElementById('controls');
    var options = {
        autoResize: true,
        locale: 'en',
        edges: {
            arrows: { to: { enabled: true } },
            smooth: { enabled: true, type: 'cubicBezier', forceDirection: 'horizontal', roundness: 0.45 }
        },
        nodes: { font: { 'face': 'monospace', 'align': 'left' }, margin: 8 },
        groups: {
            stage: { shape: 'box', color: { background: '#cfe8cf', border: '#5a9e5a' } },
            variable: { shape: 'ellipse', color: { background: '#cfe0f5', border: '#5588cc' } }
        },
        layout: {
            "hierarchical": {
                "enabled": true,
                "sortMethod": "directed",
                "direction": "LR",
                levelSeparation: 200,
                nodeSpacing: 110,
                treeSpacing: 40,
                blockShifting: true,
                edgeMinimization: true,
                parentCentralization: true,
                shakeTowards: 'roots'
            }
        },
        physics: { enabled: false },
        configure: { enabled: true, filter: 'layout physics', showButton: false, container: controls }
    };

    let network = new vis.Network(container, {nodes, edges}, options);
    window.network = network;
    network.setSize('100%', '100%');
    network.redraw();
    network.on('click', function (properties) {
        var ids = properties.nodes;
        var clickedNodes = nodes.get(ids);
        var control = document.getElementById("details");
        if (clickedNodes[0]) {
            control.innerHTML = clickedNodes[0].full_label || clickedNodes[0].label;
        } else {
            control.innerHTML = "<b>Pipeline</b>: {{PIPELINE_NAME}}";
        }
    });
</script>
<footer>
    <p>{{GENERATED_AT}}</p>
</footer>
</body>
</html>
