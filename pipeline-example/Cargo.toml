[package]
name = "pipeline-example"
authors.workspace = true
license.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
version.workspace = true
publish = false

[dependencies]
chrono = { workspace = true }
# A single dependency — pipeline-dsl re-exports the value layer.
pipeline-dsl = { path = "../pipeline-dsl" }
anyhow = "1.0.93"
thiserror = "2.0.3"

[dev-dependencies]
# Only for the async_harness example (this crate is `publish = false`, so these
# never reach the published crates).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
flume = "0.11"
