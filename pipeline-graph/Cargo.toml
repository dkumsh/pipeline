[package]
name = "pipeline-graph"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Dynamic (runtime-wired) pipeline graph over the pipeline-core value layer."
repository.workspace = true
keywords.workspace = true
readme = "README.md"
# Doc images are shown in the README via absolute raw-GitHub URLs, so there's no
# need to ship them in the published crate.
exclude = ["doc/*.png"]

[dependencies]
pipeline-core = { path = "../pipeline-core", version = "0.5" }
pipeline-diagram = { path = "../pipeline-diagram", version = "0.5" }
chrono = { workspace = true }
