[workspace.package]
authors = ["Dmitriy Kumshayev"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/dkumsh/pipeline"
readme = "README.md"
keywords = ["pipeline", "dataflow", "dag", "macro", "workflow"]
description = "Compile‑time pipeline DSL for structuring computations"
edition = "2024"
version = "0.8.2"

[workspace]
resolver = "2"

members = [
    "pipeline-core",
    "pipeline-diagram",
    "pipeline-macros",
    "pipeline-dsl",
    "pipeline-graph",
    "pipeline-example",
]

[workspace.dependencies]
# Internal crates — the version requirement lives here only, so a release bump
# is a single edit (plus [workspace.package] version above). Paths are relative
# to the workspace root. pipeline-macros is exact-pinned: the macro's generated
# paths are coupled to what pipeline-dsl re-exports, so the two move in lockstep.
pipeline-core = { path = "pipeline-core", version = "0.8" }
pipeline-diagram = { path = "pipeline-diagram", version = "0.8" }
pipeline-macros = { path = "pipeline-macros", version = "=0.8.2" }

chrono = "0.4"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.133"
