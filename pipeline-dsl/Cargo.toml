[package]
name = "pipeline-dsl"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Static #[pipeline]/#[stage] DSL over the pipeline-core value layer."
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
pipeline-core = { path = "../pipeline-core", version = "0.5" }
# Exact-pinned: the macro's generated paths are coupled to what this crate
# re-exports, so the two must move in lockstep.
pipeline-macros = { path = "../pipeline-macros", version = "=0.5.0" }

[dev-dependencies]
thiserror = { workspace = true }

[lib]
name = "pipeline_dsl"
crate-type = ["rlib"]
