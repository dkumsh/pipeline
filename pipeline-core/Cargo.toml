[package]
name = "pipeline-core"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Core value layer (Value/Vector/Buckets) and Reset trait shared by the pipeline crates."
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
rayon = { version = "1", optional = true }
thiserror = { workspace = true }

[features]
# Parallel `Vector` access patterns (e.g. `par_update2`). Off by default so
# the core layer stays dependency-light; consumers opt in.
parallel = ["dep:rayon"]

[lib]
name = "pipeline"
crate-type = ["rlib"]
